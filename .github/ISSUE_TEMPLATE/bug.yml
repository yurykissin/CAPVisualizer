name: Bug report
description: Report a reproducible CAPVisualizer defect without tenant-sensitive data
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not attach tenant exports, names.json, transcripts, certificates, secrets, or customer screenshots.
  - type: input
    id: version
    attributes:
      label: CAPVisualizer version or commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or redacted examples only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
