name: Feature request
description: Propose a focused improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints considered
      options:
        - label: Read-only and least-privilege behavior
        - label: Offline operation
        - label: Safe-export privacy
